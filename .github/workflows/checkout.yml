name: Dynamic Package Checkout

on:
  workflow_dispatch:
    inputs:
      package_list:
        description: 'Comma-separated list of packages to checkout (e.g., PackageA, PackageB)'
        required: true
        type: string
        default: 'PackageA, PackageC'

jobs:
 checkout:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout repository
     uses: actions/checkout@v4
     with:
      fetch-depth: 1

   - name: Sparse checkout selected packages
     run: |
       git sparse-checkout init --cone

       IFS=',' read -ra PKGS <<< "${{ github.event.inputs.package_list }}"

       git sparse-checkout set "${PKGS[@]}"

       echo "Checked out packages:"
       printf '%s\n' "${PKGS[@]}"

   - name: Verify
     run: |
