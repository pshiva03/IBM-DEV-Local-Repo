name: Adapter connection package checkout

on:
  workflow_dispatch:
    inputs:
     Adapter_ConfigPkg:
      description: "Package consists of adapter connection"
      type: string
     Target_Env:
      description: "Target environment to deploy connection"
      type: string

jobs:
 deploy:
  runs-on: ubuntu-latest
  
  environment:
   name: ${{ inputs.Target_Env }}

  steps:
   - name: Checkout repository
     uses: actions/checkout@v4
     with:
      fetch-depth: 1
     
   - name: Checkout Selected Package (excluding config)
     run: |
       mkdir -p deploy/${{ inputs.Adapter_ConfigPkg }}
       # Copy everything except the config directory
       find ${{ github.workspace }}/${{ inputs.Adapter_ConfigPkg }} -maxdepth 1 -type f -exec cp {} deploy/${{ inputs.Adapter_ConfigPkg }}/ \;
       # Copy directories except config
       find ${{ github.workspace }}/${{ inputs.Adapter_ConfigPkg }} -maxdepth 1 -type d ! -name config ! -name . -exec cp -r {} deploy/${{ inputs.Adapter_ConfigPkg }}/ \;
       # Create empty config directory
       mkdir -p deploy/${{ inputs.Adapter_ConfigPkg }}/config

   - name: Copy only the required Environment Configuration
     run: |
       Config_File="${{ github.workspace }}/${{ inputs.Adapter_ConfigPkg }}/config/JDBCConnDetails_${{ inputs.Target_Env }}.csv"
       Dest_Dir="deploy/${{ inputs.Adapter_ConfigPkg }}/config/"
       
       echo "Copying only ${{ inputs.Target_Env }} config file"
       echo "Source: $Config_File"
       echo "Destination: $Dest_Dir"
       
       if [ -f "$Config_File" ]; then
         cp "$Config_File" "$Dest_Dir"
         echo "✓ Environment-specific config file copied successfully"
       else
         echo "✗ Config file not found: $Config_File"
         exit 1
       fi

   - name: Verify deployment folder (only environment config)
     run: |
       echo "Verifying deployed files:"
       find deploy/${{ inputs.Adapter_ConfigPkg }}/config/ -type f
       echo ""
       echo "File count in config directory:"
       find deploy/${{ inputs.Adapter_ConfigPkg }}/config/ -type f | wc -l

   - name: Deploy Package
     run: |
      echo "Deploying Package ${{ inputs.Adapter_ConfigPkg }}"
      echo "Environment ${{ inputs.Target_Env }}"
      
   - name: Verify deployment folder
     run: |
       echo "Verifying deployed files:"
       find ${{ github.workspace }}/deploy/${{ inputs.Adapter_ConfigPkg }}/config/ -type f
       ls -la deploy/${{ inputs.Adapter_ConfigPkg }}/config/
